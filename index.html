<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Subway 3D</title>
    <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
    <!-- #ui precedes #map so keyboard focus reaches search first; before this,
         Tab crossed the map canvas and its four attribution links — six stops —
         before arriving at the search box. Both are position: fixed and the
         painting order is pinned by z-index in styles.css, so the visual result
         is unchanged. The map keeps its own tab stop (and its arrow-key
         panning) rather than being removed from the order with tabindex="-1". -->
    <div id="ui">
        <div id="search-bar"></div>
        <div id="view-controls">
            <button id="btn-lines" aria-label="Filter lines">Lines</button>
            <button id="btn-status" aria-label="Service status" data-tone="none">
                Status<span id="status-dot"></span>
            </button>
            <button id="btn-3d">3D</button>
            <button id="btn-2d">2D</button>
        </div>
        <div id="staleness" class="hidden">
            <span id="staleness-dot"></span>
            <span id="staleness-label">Live</span>
        </div>
    </div>

    <div id="map"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
