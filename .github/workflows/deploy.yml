name: Deploy

on:
  push:
    # Vercel's Git integration handles preview deploys for every branch, so
    # these triggers are about tests and the Fly.io deploy only.
    branches: [master, "phase-*"]
  pull_request:

# A branch with an open PR matches both triggers above. Grouping by head_ref
# collapses those into one run when they overlap. Superseded runs are cancelled,
# but master is never cancelled mid-flight: those runs push to Fly.io, and
# interrupting a flyctl deploy is not something to do for convenience.
concurrency:
  # head_ref is the branch name on pull_request and empty on push; ref_name is
  # the branch name on push. Together they yield the same key ("phase-6") for
  # both triggers, which is what makes the two runs collapse into one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-js:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  test-go:
    name: Go tests (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd api && go test ./... -race

  # The frontend is NOT deployed from here. Vercel's Git integration builds and
  # deploys every push itself, using vercel.json's buildCommand. This workflow
  # used to do the same thing in parallel, and the two silently diverged: only
  # this one ran the GTFS download, while Vercel's build won the production
  # alias, so the deployed app served 45 of ~496 stations for weeks. One
  # pipeline, not two. The GTFS download is npm's prebuild hook now, so it runs
  # inside Vercel's build, and scripts/verify-build.mjs fails that build if the
  # data is missing.

  deploy-api:
    name: Deploy API → Fly.io
    if: github.ref == 'refs/heads/master'
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: the feed cache is in-process, so a second machine would poll
      # MTA independently and serve inconsistent data. Exactly one instance.
      - run: cd api && flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
