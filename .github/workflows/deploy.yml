name: Deploy

on:
  push:
    # Vercel's Git integration handles preview deploys for every branch, so
    # these triggers are about tests and the Fly.io deploy only.
    branches: [master, "phase-*"]
  pull_request:

# A branch with an open PR matches both triggers above. Grouping by head_ref
# collapses those into one run when they overlap. Superseded runs are cancelled,
# but master is never cancelled mid-flight: those runs push to Fly.io, and
# interrupting a flyctl deploy is not something to do for convenience.
concurrency:
  # head_ref is the branch name on pull_request and empty on push; ref_name is
  # the branch name on push. Together they yield the same key ("phase-6") for
  # both triggers, which is what makes the two runs collapse into one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-js:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  startup-smoke:
    name: Startup probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Builds and serves the app inside the runner rather than measuring a
      # deployment. Two reasons: hitting production on every push is the traffic
      # pattern that got this project's own domain served a firewall challenge,
      # and a runner's datacenter IP is exactly what bot mitigation looks for.
      #
      # Server start, readiness wait and measurement are one step on purpose.
      # Each `run` is its own shell, so a server backgrounded in one step is not
      # something the next step can rely on. Readiness is a curl loop rather
      # than wait-on, which is not a dependency here and would otherwise be
      # fetched from the network mid-run.
      #
      # This is a smoke test for the probes, NOT a performance budget. Timings
      # from a shared runner against localhost are not comparable to the numbers
      # measured against production, so nothing asserts on duration — only that
      # each probe still resolves. It exists because '#chip-bar .chip' outlived
      # the chip bar by two merges, reporting TIMEOUT that nobody was watching.
      #
      # 'scene' is excluded deliberately: it waits on the staleness indicator,
      # which needs map tiles, and Stadia serves those keyless only from
      # localhost — a runner gets 401s. Including it would fail for reasons
      # unrelated to the code. The gap is real: a rotted '#staleness' selector
      # will not be caught here.
      - name: Build, serve and probe
        run: |
          npm run build
          npx vite preview --port 4173 --strictPort &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sSf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -sSf -o /dev/null http://localhost:4173/
          RUNS=1 REQUIRE=interactive,lines PROBE_TIMEOUT_MS=45000 \
            node scripts/measure-startup.mjs "ci=http://localhost:4173"

  test-go:
    name: Go tests (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: cd api && go test ./... -race

  # The frontend is NOT deployed from here. Vercel's Git integration builds and
  # deploys every push itself, using vercel.json's buildCommand. This workflow
  # used to do the same thing in parallel, and the two silently diverged: only
  # this one ran the GTFS download, while Vercel's build won the production
  # alias, so the deployed app served 45 of ~496 stations for weeks. One
  # pipeline, not two. The GTFS download is npm's prebuild hook now, so it runs
  # inside Vercel's build, and scripts/verify-build.mjs fails that build if the
  # data is missing.

  deploy-api:
    name: Deploy API → Fly.io
    if: github.ref == 'refs/heads/master'
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: the feed cache is in-process, so a second machine would poll
      # MTA independently and serve inconsistent data. Exactly one instance.
      - run: cd api && flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
