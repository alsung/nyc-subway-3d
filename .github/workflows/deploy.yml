name: Deploy

on:
  push:
    # phase-* pushes deploy to Vercel preview, so in-progress phase work is
    # reachable at a stable URL without opening a PR. Only master reaches
    # production — see the ref guards on the deploy jobs below.
    branches: [master, "phase-*"]
  pull_request:

# A branch with an open PR matches both triggers above. Grouping by head_ref
# collapses those into one run. Superseded preview runs are cancelled, but
# master is never cancelled mid-flight: those runs push to Fly.io, and
# interrupting a flyctl deploy is not something to do for convenience.
concurrency:
  # head_ref is the branch name on pull_request and empty on push; ref_name is
  # the branch name on push. Together they yield the same key ("phase-6") for
  # both triggers, which is what makes the two runs collapse into one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-js:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  test-go:
    name: Go tests (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd api && go test ./... -race

  deploy-frontend:
    name: Deploy frontend → Vercel (${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }})
    needs: [test-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # No explicit GTFS download step: it is npm's prebuild hook now, so it
      # runs inside whichever build produces the deployed output — including
      # `vercel build` below, which is the one that actually ships. Running it
      # here instead was why every deployment went out without the data.
      - run: npm run build
      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/master'
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to Vercel (preview / staging)
        if: github.ref != 'refs/heads/master'
        run: |
          npm install -g vercel
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-api:
    name: Deploy API → Fly.io
    if: github.ref == 'refs/heads/master'
    needs: [test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: the feed cache is in-process, so a second machine would poll
      # MTA independently and serve inconsistent data. Exactly one instance.
      - run: cd api && flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
