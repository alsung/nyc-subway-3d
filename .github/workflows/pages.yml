name: Architecture map

# Publishes docs/architecture.html to GitHub Pages, so the README can link to
# the interactive map (GitHub strips scripts from Markdown). The page is
# generated by npm run arch and checked by the Deploy workflow, so this only
# copies the committed file.
on:
  push:
    branches: [master]
    paths: [docs/architecture.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish architecture map
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Only the generated page goes on the site, not the template or JSON.
      - run: mkdir _site && cp docs/architecture.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
